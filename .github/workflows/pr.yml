name: PR checks

on:
  pull_request:
    # labeled/unlabeled so adding `coverage-exempt` re-runs the diff coverage gate.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the lint step can diff against the merge base.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      # Bun installs only; Node (from .node-version) still runs typecheck, tests and Next.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint changed files
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # On push to master `before` can be all zeros (new branch); lint the last commit then.
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then BASE_REF=HEAD~1; fi
          scripts/ci/lint-changed.sh "$BASE_REF"

      - name: Design lint (raw controls and colors; baseline in scripts/ci/design-lint-baseline.txt)
        run: node scripts/ci/design-lint.mjs

      - name: Test
        run: bunx vp test run --coverage --coverage.reportOnFailure --reporter=default --reporter=json --outputFile=vitest-report.json || true

      - name: Fail on any test failure (except tests/__baseline__/known-fails.txt, kept empty)
        run: node scripts/ci/compare-tests.mjs vitest-report.json

      - name: Coverage summary
        if: always()
        run: node scripts/ci/coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      # Gates (rules in REVIEW.md). Read-only: no secrets, so fork PRs run them too.
      - name: Diff coverage (changed lines >= 80%)
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          COVERAGE_EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-exempt') }}
        run: |
          set -o pipefail
          node scripts/ci/diff-coverage.mjs "$BASE_REF" coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Coverage ratchet (tests/__baseline__/coverage.json)
        if: always()
        run: |
          set -o pipefail
          node scripts/ci/coverage-ratchet.mjs check coverage/coverage-summary.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vitest-report
          path: vitest-report.json
          retention-days: 14
