name: Release Notes

on:
  push:
    tags:
      - "v[1-9][0-9][0-9]*.*.*"

permissions:
  contents: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # changelogithub picks its range from tags reachable from HEAD and creates the release
      # without make_latest, so GitHub marks every new stable release "Latest". Pass the
      # previous version explicitly (v100.7.1 diffs against v100.7.0, never v101.0.0). A stable
      # release that is not the highest is created as a draft and published with
      # --latest=false, so "Latest" never moves to a backport, not even briefly.
      - name: Resolve release range
        id: range
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          previous="$(node scripts/ci/floating-tags.mjs previous "$TAG")"
          highest="$(node scripts/ci/floating-tags.mjs highest)"
          backport=false
          if [[ "$TAG" != *-* && -n "$highest" && "$highest" != "$TAG" ]]; then
            backport=true
          fi
          # A tag that is not on the default branch was cut from a support branch.
          support=false
          if ! git merge-base --is-ancestor "$TAG" "origin/${DEFAULT_BRANCH}"; then
            support=true
          fi
          {
            echo "previous=${previous}"
            echo "highest=${highest}"
            echo "backport=${backport}"
            echo "support=${support}"
          } >> "$GITHUB_OUTPUT"
          echo "previous=${previous:-<none>} highest=${highest:-<none>} backport=${backport} support=${support}"

      # Master releases: changelogithub, from the commit subjects between the two tags.
      - name: Write GitHub release notes from Conventional Commits
        if: steps.range.outputs.support != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ steps.range.outputs.previous }}
          BACKPORT: ${{ steps.range.outputs.backport }}
        run: |
          set -euo pipefail
          args=(--to "$TAG")
          if [[ -n "$PREVIOUS" ]]; then args+=(--from "$PREVIOUS"); fi
          if [[ "$BACKPORT" == "true" ]]; then args+=(--draft); fi
          bunx changelogithub@15.0.5 "${args[@]}"

      # Support-branch releases: the tag's CHANGELOG.md entry (git-cliff, written by
      # `vp run backport`). changelogithub only reads commit subjects, and a squash-merged
      # backport PR is one `chore(release): …` commit, which it drops ("No significant changes").
      - name: Write GitHub release notes from CHANGELOG.md
        if: steps.range.outputs.support == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BACKPORT: ${{ steps.range.outputs.backport }}
        run: |
          set -euo pipefail
          git show "${TAG}:CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md"
          node scripts/ci/changelog-section.mjs "$TAG" "$RUNNER_TEMP/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md")
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            if [[ "$BACKPORT" == "true" ]]; then args+=(--draft); fi
            gh release create "$TAG" "${args[@]}"
          fi

      - name: Publish backport without taking "Latest"
        if: steps.range.outputs.backport == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          HIGHEST: ${{ steps.range.outputs.highest }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          if gh release view "$HIGHEST" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$HIGHEST" --repo "$GITHUB_REPOSITORY" --latest
            echo "::notice title=Backport release::${TAG} is not the highest stable release; Latest stays on ${HIGHEST}."
          else
            echo "::warning title=No release for highest tag::${HIGHEST} has no GitHub release; Latest left unchanged."
          fi
