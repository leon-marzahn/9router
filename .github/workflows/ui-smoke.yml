name: UI smoke

# Visits every dashboard route and the UI states in scripts/ui-smoke/states.json
# (dialogs, drawers, menus) in Chromium (desktop + touch-phone viewport) on a
# demo-seeded production build and fails on new horizontal overflow, console
# errors, failing same-origin requests, small mobile tap targets and serious axe
# violations. Known issues: scripts/ui-smoke/baseline.txt. Local: `bun run smoke`.
#
# Pull requests check only the routes/states their changes can affect, plus a
# core set (scripts/ui-smoke/affected.mjs); master and manual runs check everything.
#
# Security: plain `pull_request` (never pull_request_target), read-only token,
# no secrets. Fork PRs run with the same read-only permissions.
on:
  pull_request:
  push:
    branches: [master, ci/smoke-states-speed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # A PR checks out its merge commit, so HEAD^1 is the base and the diff is the PR.
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # Keyed on the pinned playwright-core version (same Chromium revision).
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright@1.63.0 install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright@1.63.0 install-deps chromium

      # Webpack's persistent cache for the smoke's `next build` (.next-smoke).
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next-smoke/cache
          key: next-smoke-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-smoke-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Smoke test
        run: node scripts/ui-smoke.mjs --out ui-smoke ${{ github.event_name == 'pull_request' && '--changed HEAD^1' || '' }}

      - name: TEMP timing subset prod
        if: always()
        run: node scripts/ui-smoke.mjs --out ui-smoke-sub-p --routes /dashboard,/dashboard/endpoint,/dashboard/providers,/dashboard/usage --states usage-request-drawer

      - name: TEMP timing subset dev
        if: always()
        run: node scripts/ui-smoke.mjs --dev --out ui-smoke-sub-d --routes /dashboard,/dashboard/endpoint,/dashboard/providers,/dashboard/usage --states usage-request-drawer

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-smoke
          path: ui-smoke/
          retention-days: 14
