name: UI smoke

# Visits every dashboard route in Chromium (desktop + touch-phone viewport) on a
# demo-seeded throwaway instance and fails on new horizontal overflow, console
# errors, failing same-origin requests, small mobile tap targets and serious axe
# violations. Known issues: scripts/ui-smoke/baseline.txt. Local: `bun run smoke`.
#
# Security: plain `pull_request` (never pull_request_target), read-only token,
# no secrets. Fork PRs run with the same read-only permissions.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ui-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # Keyed on the pinned playwright-core version (same Chromium revision).
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright@1.63.0 install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright@1.63.0 install-deps chromium

      - name: Smoke test
        run: node scripts/ui-smoke.mjs --out ui-smoke

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-smoke
          path: ui-smoke/
          retention-days: 14
