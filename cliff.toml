# git-cliff: generates the newest CHANGELOG.md entry from Conventional Commits.
# Run through `npm run release <version>` (scripts/release.mjs), not by hand.

[changelog]
header = ""
body = """
# v{{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% for group, commits in commits | group_by(attribute="group") %}
## {{ group | striptags | trim }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{% endfor %}{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
# Only our epoch-semver tags; upstream 9router v0.x tags are ignored.
tag_pattern = "v[1-9][0-9]{2,}\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^chore\\(sync\\)", group = "<!-- 3 -->9router sync" },
  { message = "^refactor", group = "<!-- 4 -->Refactors" },
  { message = "^docs", group = "<!-- 5 -->Docs" },
  { message = "^(ci|build)", group = "<!-- 6 -->Build & CI" },
  { message = "^(chore|test|style)", skip = true },
]
